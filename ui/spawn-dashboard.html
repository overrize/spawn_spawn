<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fork‑Agent Live Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS
   ═══════════════════════════════════════════════ */
:root {
  /* palette */
  --bg-deep:        #06060c;
  --bg-surface:     #0f0f1a;
  --bg-card:        #161625;
  --bg-card-hover:  #1c1c30;
  --bg-input:       #0a0a14;
  --border-subtle:  #1e1e32;
  --border-active:  #2d2d4a;
  --text-primary:   #e2e2ed;
  --text-secondary: #8b8ba3;
  --text-dim:       #58586e;
  --accent-amber:   #f59e0b;

  /* agent type colours */
  --clr-main:       #c8a951;
  --clr-main-glow:  rgba(200,169,81,0.25);
  --clr-spawn:      #4ec9b0;
  --clr-spawn-glow: rgba(78,201,176,0.25);
  --clr-fork:       #6a9955;
  --clr-fork-glow:  rgba(106,153,85,0.25);

  /* status palette */
  --status-idle:         #6b7280;
  --status-running:      #22c55e;
  --status-paused:       #eab308;
  --status-terminated:   #ef4444;
  --status-error:        #f97316;
  --status-transition:   #3b82f6;

  /* spacing scale (4px base) */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-10: 40px;
  --space-12: 48px;

  /* radii */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;

  /* typography */
  --font-display: 'DM Serif Display', Georgia, serif;
  --font-body:    'DM Sans', -apple-system, sans-serif;
  --font-mono:    'DM Sans', monospace;

  /* transitions */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-fast: 150ms;
  --dur-normal: 300ms;
  --dur-slow: 500ms;

  /* shadows */
  --shadow-glow-main: 0 0 24px var(--clr-main-glow);
  --shadow-glow-spawn: 0 0 24px var(--clr-spawn-glow);
  --shadow-glow-fork: 0 0 24px var(--clr-fork-glow);
  --shadow-card: 0 2px 12px rgba(0,0,0,.4);
}

/* ═══════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 15px; -webkit-font-smoothing: antialiased; }

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ── noise texture overlay ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: .035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 200px 200px;
}

/* ── grid background ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .04;
  background-image:
    linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
  background-size: 48px 48px;
  background-position: -1px -1px;
}

/* ═══════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════ */
#app {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

/* ── header ── */
.dash-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--space-4);
  flex-wrap: wrap;
  padding-bottom: var(--space-4);
  border-bottom: 1px solid var(--border-subtle);
}

.dash-header h1 {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 400;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  line-height: 1.1;
}

.dash-header h1 span {
  color: var(--accent-amber);
}

.dash-header .mode-badge {
  font-family: var(--font-mono);
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: .12em;
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}
.dash-header .mode-badge.live { border-color: var(--status-running); color: var(--status-running); }

/* ── stats bar ── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: var(--space-3);
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.stat-card .stat-label {
  font-family: var(--font-mono);
  font-size: .65rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-dim);
}

.stat-card .stat-value {
  font-family: var(--font-display);
  font-size: 1.75rem;
  line-height: 1;
  color: var(--text-primary);
}

.stat-card .stat-sub {
  font-size: .7rem;
  color: var(--text-secondary);
}

/* ── main content grid ── */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 340px;
  grid-template-rows: auto auto;
  gap: var(--space-4);
  align-items: start;
}

@media (max-width: 1024px) {
  .main-grid { grid-template-columns: 1fr; }
}

/* ── agent hierarchy ── */
.agent-zone {
  grid-column: 1;
  grid-row: 1 / 3;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

.section-title {
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  user-select: none;
}

.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-subtle);
  margin-left: var(--space-2);
}

/* ── agent cards ── */
.agent-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  cursor: pointer;
  position: relative;
  transition:
    border-color var(--dur-normal) var(--ease-out),
    box-shadow var(--dur-normal) var(--ease-out),
    transform var(--dur-normal) var(--ease-out),
    background var(--dur-normal) var(--ease-out);
  user-select: none;
  animation: card-enter var(--dur-slow) var(--ease-spring) both;
}

.agent-card:hover {
  background: var(--bg-card-hover);
  transform: translateY(-1px);
}

.agent-card.selected {
  z-index: 2;
}

.agent-card.selected.type-main  { border-color: var(--clr-main);  box-shadow: var(--shadow-glow-main),  var(--shadow-card); }
.agent-card.selected.type-spawn { border-color: var(--clr-spawn); box-shadow: var(--shadow-glow-spawn), var(--shadow-card); }
.agent-card.selected.type-fork  { border-color: var(--clr-fork);  box-shadow: var(--shadow-glow-fork),  var(--shadow-card); }

/* type accent stripe */
.agent-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px;
  height: 100%;
  border-radius: var(--radius-lg) 0 0 var(--radius-lg);
  transition: width var(--dur-normal) var(--ease-out);
}

.agent-card.type-main::before  { background: var(--clr-main); }
.agent-card.type-spawn::before { background: var(--clr-spawn); }
.agent-card.type-fork::before  { background: var(--clr-fork); }

.agent-card.selected::before { width: 5px; }

/* card internals */
.agent-card .card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  margin-bottom: var(--space-2);
}

.agent-card .card-type {
  font-family: var(--font-mono);
  font-size: .55rem;
  text-transform: uppercase;
  letter-spacing: .14em;
  padding: 2px var(--space-2);
  border-radius: var(--radius-sm);
}

.type-main .card-type  { background: rgba(200,169,81,.12); color: var(--clr-main); }
.type-spawn .card-type { background: rgba(78,201,176,.12); color: var(--clr-spawn); }
.type-fork .card-type  { background: rgba(106,153,85,.12); color: var(--clr-fork); }

.agent-card .card-id {
  font-family: var(--font-mono);
  font-size: .65rem;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.agent-card .card-desc {
  font-size: .75rem;
  color: var(--text-secondary);
  margin-bottom: var(--space-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* status badge */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: .55rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  padding: 2px var(--space-2);
  border-radius: var(--radius-sm);
  border: 1px solid;
  transition: all var(--dur-fast) var(--ease-out);
}

.status-IDLE           { color: var(--status-idle);         border-color: rgba(107,114,128,.3); background: rgba(107,114,128,.08); }
.status-RUNNING        { color: var(--status-running);      border-color: rgba(34,197,94,.3);  background: rgba(34,197,94,.08); }
.status-PAUSED         { color: var(--status-paused);       border-color: rgba(234,179,8,.3);  background: rgba(234,179,8,.08); }
.status-TERMINATED     { color: var(--status-terminated);   border-color: rgba(239,68,68,.3);  background: rgba(239,68,68,.08); }
.status-ERROR          { color: var(--status-error);        border-color: rgba(249,115,22,.3);  background: rgba(249,115,22,.08); }
.status-INITIALIZING   { color: var(--status-transition);   border-color: rgba(59,130,246,.3); background: rgba(59,130,246,.08); }
.status-TERMINATING    { color: var(--status-transition);   border-color: rgba(59,130,246,.3); background: rgba(59,130,246,.08); }
.status-RESUMING       { color: var(--status-transition);   border-color: rgba(59,130,246,.3); background: rgba(59,130,246,.08); }

/* status dot */
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.status-IDLE .status-dot           { background: var(--status-idle); }
.status-RUNNING .status-dot        { background: var(--status-running); box-shadow: 0 0 6px var(--status-running); }
.status-PAUSED .status-dot         { background: var(--status-paused); }
.status-TERMINATED .status-dot     { background: var(--status-terminated); }
.status-ERROR .status-dot          { background: var(--status-error); }
.status-INITIALIZING .status-dot   { background: var(--status-transition); animation: pulse-dot 0.8s ease-in-out infinite; }
.status-TERMINATING .status-dot    { background: var(--status-transition); animation: pulse-dot 0.6s ease-in-out infinite; }
.status-RESUMING .status-dot       { background: var(--status-transition); animation: pulse-dot 0.8s ease-in-out infinite; }

/* fork row */
.fork-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-top: var(--space-3);
  padding-left: var(--space-8);
  border-left: 1px dashed var(--border-subtle);
}

.fork-row .agent-card {
  flex: 1;
  min-width: 200px;
  max-width: 320px;
  animation-delay: 0s;
}

/* spawn section */
.spawn-section {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

/* ── sidebar panels ── */
.side-panel {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
  grid-column: 2;
}

.side-panel .panel-head {
  font-family: var(--font-display);
  font-size: .85rem;
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.side-panel .panel-head .panel-count {
  font-family: var(--font-mono);
  font-size: .6rem;
  color: var(--text-dim);
}

.panel-body {
  padding: var(--space-3) var(--space-4);
  max-height: 260px;
  overflow-y: auto;
}

/* ── memory table ── */
.mem-table {
  width: 100%;
  border-collapse: collapse;
}

.mem-table th {
  font-family: var(--font-mono);
  font-size: .55rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-dim);
  text-align: left;
  padding: var(--space-1) var(--space-2);
  border-bottom: 1px solid var(--border-subtle);
}

.mem-table td {
  font-size: .7rem;
  padding: var(--space-1) var(--space-2);
  border-bottom: 1px solid rgba(255,255,255,.03);
  color: var(--text-secondary);
}

.mem-table .mem-key {
  font-family: var(--font-mono);
  color: var(--accent-amber);
}

.mem-table .mem-val {
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-secondary);
}

.mem-empty {
  font-size: .7rem;
  color: var(--text-dim);
  text-align: center;
  padding: var(--space-6) 0;
  font-style: italic;
}

/* ── event log ── */
.event-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.event-item {
  font-family: var(--font-mono);
  font-size: .6rem;
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  animation: event-slide 0.35s var(--ease-spring) both;
  background: rgba(255,255,255,.02);
  border: 1px solid transparent;
}

.event-item .event-type {
  padding: 1px 5px;
  border-radius: 3px;
  font-size: .5rem;
  font-weight: 600;
  letter-spacing: .06em;
  flex-shrink: 0;
}

.event-SET     .event-type { background: rgba(34,197,94,.15);  color: var(--status-running); }
.event-DELETE  .event-type { background: rgba(239,68,68,.15);  color: var(--status-terminated); }
.event-CLEAR   .event-type { background: rgba(249,115,22,.15); color: var(--status-error); }
.event-SNAPSHOT .event-type{ background: rgba(59,130,246,.15); color: var(--status-transition); }

.event-item .event-detail {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-secondary);
}

.event-item .event-time {
  font-size: .55rem;
  color: var(--text-dim);
  flex-shrink: 0;
}

.event-empty {
  font-size: .7rem;
  color: var(--text-dim);
  text-align: center;
  padding: var(--space-6) 0;
  font-style: italic;
}

/* ── controls ── */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  align-items: center;
}

.control-group {
  display: flex;
  gap: var(--space-1);
  align-items: center;
  padding: var(--space-1) var(--space-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--bg-card);
}

.control-divider {
  width: 1px;
  height: 20px;
  background: var(--border-subtle);
  margin: 0 var(--space-1);
}

.btn {
  font-family: var(--font-mono);
  font-size: .6rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: var(--space-1) var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease-out);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
}

.btn:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-active);
  color: var(--text-primary);
}

.btn:active { transform: scale(0.97); }

.btn.btn-spawn  { border-color: rgba(78,201,176,.3); color: var(--clr-spawn); }
.btn.btn-fork   { border-color: rgba(106,153,85,.3); color: var(--clr-fork); }
.btn.btn-pause  { border-color: rgba(234,179,8,.3);  color: var(--status-paused); }
.btn.btn-resume { border-color: rgba(34,197,94,.3);  color: var(--status-running); }
.btn.btn-terminate { border-color: rgba(239,68,68,.3); color: var(--status-terminated); }
.btn.btn-memory { border-color: rgba(245,158,11,.3); color: var(--accent-amber); }

.btn.btn-spawn:hover  { background: rgba(78,201,176,.08); }
.btn.btn-fork:hover   { background: rgba(106,153,85,.08); }
.btn.btn-pause:hover  { background: rgba(234,179,8,.08); }
.btn.btn-resume:hover { background: rgba(34,197,94,.08); }
.btn.btn-terminate:hover { background: rgba(239,68,68,.08); }
.btn.btn-memory:hover { background: rgba(245,158,11,.08); }

.btn:disabled {
  opacity: .3;
  pointer-events: none;
}

/* memory input */
.mem-input-row {
  display: flex;
  gap: var(--space-1);
  align-items: center;
}

.mem-input {
  font-family: var(--font-mono);
  font-size: .65rem;
  padding: var(--space-1) var(--space-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  color: var(--text-primary);
  outline: none;
  width: 80px;
}

.mem-input:focus {
  border-color: var(--accent-amber);
}

.mem-input.key-input { width: 70px; }
.mem-input.val-input { width: 90px; }

/* select styling */
.spawn-select {
  font-family: var(--font-mono);
  font-size: .6rem;
  padding: var(--space-1) var(--space-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  color: var(--text-primary);
  outline: none;
  max-width: 160px;
}

/* ═══════════════════════════════════════════════
   ANIMATIONS
   ═══════════════════════════════════════════════ */
@keyframes card-enter {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50%      { opacity: .3; }
}

@keyframes event-slide {
  from { opacity: 0; transform: translateX(8px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(34,197,94,.15); }
  50%      { box-shadow: 0 0 20px rgba(34,197,94,.35); }
}

.card-status-changed {
  animation: pulse-glow 0.6s var(--ease-out);
}

/* ═══════════════════════════════════════════════
   SCROLLBAR
   ═══════════════════════════════════════════════ */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }

/* ── toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 10000;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  font-family: var(--font-mono);
  font-size: .65rem;
  color: var(--text-secondary);
  animation: event-slide 0.3s var(--ease-spring) both;
  pointer-events: none;
}
.toast.error { border-color: var(--status-error); color: var(--status-error); }
</style>
</head>
<body>

<div id="app">
  <!-- header -->
  <header class="dash-header">
    <h1>Fork‑Agent <span>Dashboard</span></h1>
    <div id="mode-badge" class="mode-badge">DEMO MODE</div>
  </header>

  <!-- stats -->
  <div class="stats-bar" id="stats-bar"></div>

  <!-- controls -->
  <div class="controls" id="controls"></div>

  <!-- main grid -->
  <div class="main-grid" id="main-grid">
    <div class="agent-zone" id="agent-zone"></div>
    <div class="side-panel" id="memory-panel">
      <div class="panel-head">Shared Memory<span class="panel-count" id="mem-count">0 entries</span></div>
      <div class="panel-body" id="mem-body"></div>
    </div>
    <div class="side-panel" id="event-panel">
      <div class="panel-head">Event Log<span class="panel-count" id="evt-count">0 events</span></div>
      <div class="panel-body" id="evt-body"></div>
    </div>
  </div>
</div>

<script type="module">
// ═══════════════════════════════════════════════
// MODULE: Try to import real fork-agent, fall back to demo
// ═══════════════════════════════════════════════

let MainAgent, SpawnAgent, ForkAgent, AgentContext, AgentStatus, AgentType, SharedMemory;
let isLiveMode = false;

// ── Mock Id Generator ──────────────────────────
let _mockCounter = 0;
const mockUuid = () => {
  _mockCounter++;
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = (_mockCounter * 16 + Math.random() * 16) % 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
};

// ── Mock Enums ─────────────────────────────────
const MockAgentStatus = {
  IDLE: 'IDLE', INITIALIZING: 'INITIALIZING', RUNNING: 'RUNNING',
  PAUSED: 'PAUSED', RESUMING: 'RESUMING', TERMINATING: 'TERMINATING',
  TERMINATED: 'TERMINATED', ERROR: 'ERROR'
};

const MockAgentType = { MAIN: 'MAIN', SPAWN: 'SPAWN', FORK: 'FORK' };

const MockMemoryEventType = {
  SET: 'memory:set', DELETE: 'memory:delete',
  CLEAR: 'memory:clear', SNAPSHOT: 'memory:snapshot'
};

// ── Mock AgentContext ─────────────────────────
class MockAgentContext {
  constructor(params) {
    this.taskId = params.taskId;
    this.agentId = params.agentId;
    this.agentType = params.agentType;
    this.description = params.description;
    this.parentChain = params.parentChain || [];
    this.constraints = params.constraints || [];
    this.metadata = params.metadata || {};
    this.createdAt = Date.now();
  }
  static createRoot(desc, constraints, metadata) {
    const tid = mockUuid();
    return new MockAgentContext({
      taskId: tid, agentId: `main-${tid.slice(0,8)}`,
      agentType: MockAgentType.MAIN, description: desc,
      constraints, metadata
    });
  }
  derive(type, desc, constraints, metadata) {
    const prefix = type === MockAgentType.SPAWN ? 'spawn' : 'fork';
    const aid = `${prefix}-${mockUuid().slice(0,8)}`;
    return new MockAgentContext({
      taskId: this.taskId, agentId: aid, agentType: type,
      description: desc,
      parentChain: [...this.parentChain, this.agentId],
      constraints: [...this.constraints, ...(constraints || [])],
      metadata: { ...this.metadata, ...(metadata || {}) }
    });
  }
}

// ── Mock SharedMemory ─────────────────────────
class MockSharedMemory {
  constructor(ownerId) {
    this._ownerId = ownerId;
    this._entries = new Map();
    this._listeners = [];
  }
  get size() { return this._entries.size; }
  keys() { return this._entries.keys(); }
  set(key, value, agentId) {
    const prev = this._entries.get(key);
    this._entries.set(key, { key, value, updatedAt: Date.now(), updatedBy: agentId });
    this._emit({ type: MockMemoryEventType.SET, key, value, previousValue: prev?.value, agentId, timestamp: Date.now() });
  }
  get(key) { const e = this._entries.get(key); return e ? e.value : undefined; }
  has(key) { return this._entries.has(key); }
  delete(key, agentId) {
    const prev = this._entries.get(key);
    if (!prev) return false;
    this._entries.delete(key);
    this._emit({ type: MockMemoryEventType.DELETE, key, previousValue: prev.value, agentId, timestamp: Date.now() });
    return true;
  }
  clear(agentId) {
    this._entries.clear();
    this._emit({ type: MockMemoryEventType.CLEAR, agentId, timestamp: Date.now() });
  }
  onChange(cb) { this._listeners.push(cb); return () => { this._listeners = this._listeners.filter(l => l !== cb); }; }
  onKeyChange(key, cb) {
    const h = (p) => { if (p.key === key) cb(p); };
    return this.onChange(h);
  }
  serialize(agentId) {
    const entries = {};
    for (const [k, e] of this._entries) entries[k] = { ...e };
    return { entries, createdAt: Date.now(), createdBy: agentId };
  }
  _emit(payload) { for (const l of this._listeners) l(payload); }
}

// ── Mock BaseAgent ────────────────────────────
class MockBaseAgent {
  constructor(context, hooks) {
    this.context = context;
    this._status = MockAgentStatus.IDLE;
    this._hooks = hooks || {};
    this._error = null;
  }
  get id() { return this.context.agentId; }
  get type() { return this.context.agentType; }
  get status() { return this._status; }
  get error() { return this._error; }
  async init() {
    try {
      this._status = MockAgentStatus.INITIALIZING;
      dashboard.render();
      await sleep(300);
      if (this._hooks.onInit) await this._hooks.onInit();
      this._status = MockAgentStatus.RUNNING;
      if (this._hooks.onStart) await this._hooks.onStart();
      dashboard.render();
    } catch (err) { this._handleError(err); }
  }
  async pause() {
    try {
      this._status = MockAgentStatus.PAUSED;
      dashboard.render();
      if (this._hooks.onPause) await this._hooks.onPause();
    } catch (err) { this._handleError(err); }
  }
  async resume() {
    try {
      this._status = MockAgentStatus.RESUMING;
      dashboard.render();
      await sleep(200);
      this._status = MockAgentStatus.RUNNING;
      if (this._hooks.onResume) await this._hooks.onResume();
      dashboard.render();
    } catch (err) { this._handleError(err); }
  }
  async terminate() {
    try {
      this._status = MockAgentStatus.TERMINATING;
      dashboard.render();
      await sleep(200);
      if (this._hooks.onTerminate) await this._hooks.onTerminate();
      this._status = MockAgentStatus.TERMINATED;
      dashboard.render();
    } catch (err) { this._handleError(err); }
  }
  _handleError(err) {
    this._error = err;
    this._status = MockAgentStatus.ERROR;
    dashboard.render();
    if (this._hooks.onError) this._hooks.onError(err).catch(() => {});
  }
}

// ── Mock MainAgent ────────────────────────────
class MockMainAgent extends MockBaseAgent {
  constructor(context, hooks) {
    super(context, hooks);
    this._children = new Map();
    this._skills = new Map();
  }
  get skills() { return { has: (n) => this._skills.has(n), register: (s) => this._skills.set(s.name, s) }; }
  get sharedSkills() { return this.skills; }
  get childIds() { return [...this._children.keys()]; }
  get childCount() { return this._children.size; }
  spawn(config) {
    const cc = this.context.derive(MockAgentType.SPAWN, config.taskDescription, config.constraints, config.metadata);
    const sa = new MockSpawnAgent(cc, this.sharedSkills, this.id);
    this._children.set(sa.id, sa);
    dashboard.render();
    return sa;
  }
  fork(fromSpawnId, config) {
    const sa = this._children.get(fromSpawnId);
    if (!sa) throw new Error(`SpawnAgent "${fromSpawnId}" not found`);
    if (sa.status !== MockAgentStatus.RUNNING && sa.status !== MockAgentStatus.IDLE)
      throw new Error(`SpawnAgent "${fromSpawnId}" is in state "${sa.status}"`);
    const fa = sa.fork(config);
    dashboard.render();
    return fa;
  }
  getChild(id) { return this._children.get(id); }
  async terminateChild(id) {
    const child = this._children.get(id);
    if (!child) throw new Error(`SpawnAgent "${id}" not found`);
    await child.terminate();
    this._children.delete(id);
    dashboard.render();
  }
  async execute() {}
}

// ── Mock SpawnAgent ───────────────────────────
class MockSpawnAgent extends MockBaseAgent {
  constructor(context, skills, parentId, hooks) {
    super(context, hooks);
    this.skills = skills;
    this.parentId = parentId;
    this.sharedMemory = new MockSharedMemory(this.id);
    this._forks = new Map();
  }
  get forkIds() { return [...this._forks.keys()]; }
  get forkCount() { return this._forks.size; }
  fork(config) {
    if (this._status !== MockAgentStatus.RUNNING && this._status !== MockAgentStatus.IDLE)
      throw new Error(`Cannot fork: SpawnAgent "${this.id}" is in state "${this._status}"`);
    const fc = this.context.derive(MockAgentType.FORK, config.taskDescription, config.constraints, config.metadata);
    const fa = new MockForkAgent(fc, this, this.id);
    this._forks.set(fa.id, fa);
    dashboard.render();
    return fa;
  }
  getFork(id) { return this._forks.get(id); }
  memorySet(k, v) { this.sharedMemory.set(k, v, this.id); dashboard.render(); }
  memoryGet(k) { return this.sharedMemory.get(k); }
  memoryDelete(k) { return this.sharedMemory.delete(k, this.id); dashboard.render(); }
  memoryClear() { this.sharedMemory.clear(this.id); dashboard.render(); }
  onMemoryChange(cb) { return this.sharedMemory.onChange(cb); }
  serializeMemory() { return this.sharedMemory.serialize(this.id); }
  async terminateFork(id) {
    const f = this._forks.get(id);
    if (!f) throw new Error(`ForkAgent "${id}" not found`);
    await f.terminate();
    this._forks.delete(id);
    dashboard.render();
  }
  async terminate() {
    for (const id of [...this._forks.keys()]) await this.terminateFork(id);
    await super.terminate();
  }
  async execute() {}
}

// ── Mock ForkAgent ────────────────────────────
class MockForkAgent extends MockBaseAgent {
  constructor(context, spawnParent, spawnParentId, hooks) {
    super(context, hooks);
    this.spawnParent = spawnParent;
    this.spawnParentId = spawnParentId;
  }
  get type() { return MockAgentType.FORK; }
  async execute() {}
}

// ── Utility ────────────────────────────────────
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ═══════════════════════════════════════════════
// TRY ESM IMPORT ────────────────────────────────
// ═══════════════════════════════════════════════

try {
  const mod = await import('../src/index.js');
  MainAgent = mod.MainAgent;
  SpawnAgent = mod.SpawnAgent;
  ForkAgent = mod.ForkAgent;
  AgentContext = mod.AgentContext;
  AgentStatus = mod.AgentStatus;

// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════

const STATE = {
  mainAgent: null,
  selectedAgentId: null,
  selectedSpawnId: null,
  events: [],          // max 20
  spawnCounter: 0,
};

// ═══════════════════════════════════════════════
// DOM REFS
// ═══════════════════════════════════════════════

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const dom = {
  get modeBadge()     { return $('#mode-badge'); },
  get statsBar()      { return $('#stats-bar'); },
  get controls()      { return $('#controls'); },
  get agentZone()     { return $('#agent-zone'); },
  get memBody()       { return $('#mem-body'); },
  get memCount()      { return $('#mem-count'); },
  get evtBody()       { return $('#evt-body'); },
  get evtCount()      { return $('#evt-count'); },
};

// ═══════════════════════════════════════════════
// STATUS HELPERS
// ═══════════════════════════════════════════════

const STATUS_COLORS = {
  IDLE: '#6b7280',
  INITIALIZING: '#3b82f6', RUNNING: '#22c55e',
  PAUSED: '#eab308', RESUMING: '#3b82f6',
  TERMINATING: '#3b82f6', TERMINATED: '#ef4444',
  ERROR: '#f97316'
};

function statusClass(s) { return `status-${s}`; }

// ═══════════════════════════════════════════════
// PUSH EVENT
// ═══════════════════════════════════════════════

function pushEvent(payload) {
  STATE.events.unshift({
    type: payload.type.replace('memory:', '').toUpperCase(),
    key: payload.key || '',
    value: payload.value !== undefined ? JSON.stringify(payload.value) : '',
    prevValue: payload.previousValue !== undefined ? JSON.stringify(payload.previousValue) : '',
    agentId: payload.agentId,
    timestamp: payload.timestamp,
  });
  if (STATE.events.length > 20) STATE.events.length = 20;
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function agentCard(agent, typeClass) {
  const status = agent.status;
  const isSelected = STATE.selectedAgentId === agent.id;
  const selClass = isSelected ? ' selected' : '';
  const desc = agent.context ? agent.context.description : '';
  const idShort = agent.id;
  const typeName = agent.type;

  return `
    <div class="agent-card type-${typeClass}${selClass}"
         data-agent-id="${escapeHtml(agent.id)}"
         data-agent-type="${escapeHtml(agent.type)}"
         onclick="window._selectAgent('${escapeHtml(agent.id)}')">
      <div class="card-header">
        <span class="card-type">${typeName}</span>
        <span class="status-badge ${statusClass(status)}">
          <span class="status-dot"></span>${status}
        </span>
      </div>
      <div class="card-id" title="${escapeHtml(agent.id)}">${escapeHtml(idShort)}</div>
      ${desc ? `<div class="card-desc">${escapeHtml(desc)}</div>` : ''}
    </div>`;
}

function renderStats() {
  const m = STATE.mainAgent;
  if (!m) { dom.statsBar.innerHTML = '<div class="stat-card"><span class="stat-label">No agent</span></div>'; return; }

  const spawns = [];
  const forks = [];
  let active = 0, paused = 0, terminated = 0, memEntries = 0;

  for (const cid of m.childIds) {
    const s = m.getChild(cid);
    if (!s) continue;
    spawns.push(s);
    if (s.status === AgentStatus.RUNNING || s.status === AgentStatus.INITIALIZING || s.status === AgentStatus.RESUMING) active++;
    else if (s.status === AgentStatus.PAUSED) paused++;
    else if (s.status === AgentStatus.TERMINATED || s.status === AgentStatus.ERROR) terminated++;
    memEntries += s.sharedMemory ? s.sharedMemory.size : 0;

    for (const fid of s.forkIds) {
      const f = s.getFork(fid);
      if (!f) continue;
      forks.push(f);
      if (f.status === AgentStatus.RUNNING || f.status === AgentStatus.INITIALIZING || f.status === AgentStatus.RESUMING) active++;
      else if (f.status === AgentStatus.PAUSED) paused++;
      else if (f.status === AgentStatus.TERMINATED || f.status === AgentStatus.ERROR) terminated++;
    }
  }

  // Main self
  if (m.status === AgentStatus.RUNNING) active++;
  else if (m.status === AgentStatus.PAUSED) paused++;
  else if (m.status === AgentStatus.TERMINATED || m.status === AgentStatus.ERROR) terminated++;

  dom.statsBar.innerHTML = `
    <div class="stat-card"><span class="stat-label">Total Agents</span><span class="stat-value">${1 + spawns.length + forks.length}</span><span class="stat-sub">1 main · ${spawns.length} spawn · ${forks.length} fork</span></div>
    <div class="stat-card"><span class="stat-label">Active</span><span class="stat-value" style="color:${STATUS_COLORS.RUNNING}">${active}</span></div>
    <div class="stat-card"><span class="stat-label">Paused</span><span class="stat-value" style="color:${STATUS_COLORS.PAUSED}">${paused}</span></div>
    <div class="stat-card"><span class="stat-label">Terminated</span><span class="stat-value" style="color:${STATUS_COLORS.TERMINATED}">${terminated}</span></div>
    <div class="stat-card"><span class="stat-label">Memory Entries</span><span class="stat-value">${memEntries}</span></div>
  `;
}

function renderAgents() {
  const m = STATE.mainAgent;
  if (!m) { dom.agentZone.innerHTML = ''; return; }

  let html = '';

  // MainAgent card
  html += `<div class="section-title">Main Orchestrator</div>`;
  html += agentCard(m, 'main');

  // Spawn sections
  for (const cid of m.childIds) {
    const s = m.getChild(cid);
    if (!s) continue;
    const spawnId = s.id;

    html += `<div class="section-title" style="margin-top:var(--space-4)">Spawn</div>`;
    html += `<div class="spawn-section">`;
    html += agentCard(s, 'spawn');

    // Forks
    if (s.forkIds.length > 0) {
      html += `<div class="fork-row">`;
      for (const fid of s.forkIds) {
        const f = s.getFork(fid);
        if (!f) continue;
        html += agentCard(f, 'fork');
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  dom.agentZone.innerHTML = html;
}

function renderMemory() {
  const m = STATE.mainAgent;
  let spawn = null;

  // Find selected spawn
  if (STATE.selectedSpawnId && m) {
    spawn = m.getChild(STATE.selectedSpawnId);
  }
  // Or from selected agent (if it's a spawn or fork)
  if (!spawn && STATE.selectedAgentId && m) {
    spawn = m.getChild(STATE.selectedAgentId);
    if (!spawn) {
      // might be a fork — find its parent spawn
      for (const cid of m.childIds) {
        const s = m.getChild(cid);
        if (s && s.getFork(STATE.selectedAgentId)) { spawn = s; STATE.selectedSpawnId = s.id; break; }
      }
    } else {
      STATE.selectedSpawnId = spawn.id;
    }
  }

  if (!spawn || !spawn.sharedMemory) {
    dom.memBody.innerHTML = '<div class="mem-empty">Select a SpawnAgent to view its shared memory</div>';
    dom.memCount.textContent = '0 entries';
    return;
  }

  const mem = spawn.sharedMemory;
  dom.memCount.textContent = `${mem.size} entries`;

  if (mem.size === 0) {
    dom.memBody.innerHTML = '<div class="mem-empty">No memory entries</div>';
    return;
  }

  let rows = '';
  for (const key of mem.keys()) {
    const entry = mem._entries ? mem._entries.get(key) : null;
    const val = entry ? entry.value : mem.get(key);
    const valStr = typeof val === 'object' ? JSON.stringify(val) : String(val);
    rows += `<tr>
      <td class="mem-key">${escapeHtml(key)}</td>
      <td class="mem-val" title="${escapeHtml(valStr)}">${escapeHtml(valStr)}</td>
    </tr>`;
  }

  dom.memBody.innerHTML = `<table class="mem-table">
    <thead><tr><th>Key</th><th>Value</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderEvents() {
  if (STATE.events.length === 0) {
    dom.evtBody.innerHTML = '<div class="event-empty">No events yet — try setting memory</div>';
    dom.evtCount.textContent = '0 events';
    return;
  }

  dom.evtCount.textContent = `${STATE.events.length} events`;

  let items = '';
  for (const evt of STATE.events) {
    const time = new Date(evt.timestamp).toLocaleTimeString('en-US', { hour12: false });
    let detail = '';
    if (evt.type === 'SET') detail = `${escapeHtml(evt.key)} = ${escapeHtml(evt.value)}`;
    else if (evt.type === 'DELETE') detail = `${escapeHtml(evt.key)} (was: ${escapeHtml(evt.prevValue)})`;
    else if (evt.type === 'CLEAR') detail = 'all entries cleared';
    else if (evt.type === 'SNAPSHOT') detail = 'snapshot restored';

    items += `<li class="event-item event-${evt.type}">
      <span class="event-type">${evt.type}</span>
      <span class="event-detail" title="${escapeHtml(evt.agentId)}">${detail}</span>
      <span class="event-time">${time}</span>
    </li>`;
  }

  dom.evtBody.innerHTML = `<ul class="event-list">${items}</ul>`;
}

function renderControls() {
  const m = STATE.mainAgent;
  if (!m) { dom.controls.innerHTML = ''; return; }

  const spawnIds = m.childIds;
  const sel = STATE.selectedAgentId;
  const selAgent = sel ? findAgent(sel) : null;
  const selType = selAgent ? selAgent.type : null;
  const selStatus = selAgent ? selAgent.status : null;

  // build spawn select (partial ids for display)
  const spawnOptions = spawnIds.map(id => {
    const s = m.getChild(id);
    if (!s) return '';
    const label = `${s.id.slice(0,16)}… [${s.status}]`;
    const isSel = id === sel || id === STATE.selectedSpawnId;
    return `<option value="${escapeHtml(id)}"${isSel ? ' selected' : ''}>${escapeHtml(label)}</option>`;
  }).join('');

  // Determine which controls are relevant
  const canPause = selAgent && selStatus === AgentStatus.RUNNING;
  const canResume = selAgent && selStatus === AgentStatus.PAUSED;
  const canTerminate = selAgent && selStatus !== AgentStatus.TERMINATED && selStatus !== AgentStatus.TERMINATING;
  const isSpawnOrFork = selType === 'SPAWN' || selType === 'FORK';
  const isSpawn = selType === 'SPAWN';
  const canFork = selAgent && selType === 'SPAWN' &&
    (selStatus === AgentStatus.RUNNING || selStatus === AgentStatus.IDLE);

  dom.controls.innerHTML = `
    <div class="control-group">
      <button class="btn btn-spawn" onclick="dashboard.spawnAgent()" ${m.status === AgentStatus.TERMINATED ? 'disabled' : ''}>+ Spawn</button>
      <button class="btn btn-fork" onclick="dashboard.forkAgent()" ${!canFork ? 'disabled' : ''}>+ Fork</button>
      <span class="control-divider"></span>
      <button class="btn btn-pause" onclick="dashboard.pauseAgent()" ${!canPause ? 'disabled' : ''}>Pause</button>
      <button class="btn btn-resume" onclick="dashboard.resumeAgent()" ${!canResume ? 'disabled' : ''}>Resume</button>
      <button class="btn btn-terminate" onclick="dashboard.terminateAgent()" ${!canTerminate || !isSpawnOrFork ? 'disabled' : ''}>Terminate</button>
    </div>
    <div class="control-group">
      <span style="font-size:.6rem;color:var(--text-dim);margin-right:4px">Target Spawn:</span>
      <select class="spawn-select" id="spawn-select" onchange="dashboard.onSpawnSelect(this.value)">
        <option value="">-- select --</option>
        ${spawnOptions}
      </select>
      <span class="control-divider"></span>
      <div class="mem-input-row">
        <input class="mem-input key-input" id="mem-key" placeholder="key" />
        <input class="mem-input val-input" id="mem-val" placeholder="value" />
        <button class="btn btn-memory" onclick="dashboard.memorySet()">Set</button>
      </div>
      <button class="btn btn-memory" onclick="dashboard.memoryClear()" style="border-color:rgba(239,68,68,.3);color:var(--status-terminated)">Clear</button>
    </div>
    <span style="font-size:.6rem;color:var(--text-dim);margin-left:auto">
      ${sel ? `Selected: ${escapeHtml(sel.slice(0,20))}… [${selType}]` : 'Click an agent card to select'}
    </span>
  `;
}

function findAgent(id) {
  const m = STATE.mainAgent;
  if (!m) return null;
  if (m.id === id) return m;
  for (const cid of m.childIds) {
    const s = m.getChild(cid);
    if (!s) continue;
    if (s.id === id) return s;
    for (const fid of s.forkIds) {
      const f = s.getFork(fid);
      if (f && f.id === id) return f;
    }
  }
  return null;
}

function renderAll() {
  renderStats();
  renderAgents();
  renderMemory();
  renderEvents();
  renderControls();

  // Update mode badge
  const badge = dom.modeBadge;
  if (badge) {
    badge.textContent = isLiveMode ? 'LIVE MODE' : 'DEMO MODE';
    badge.className = 'mode-badge' + (isLiveMode ? ' live' : '');
  }
}

// ═══════════════════════════════════════════════
// DASHBOARD API
// ═══════════════════════════════════════════════

const dashboard = {
  STATE,

  async init() {
    // Create MainAgent
    const rootCtx = AgentContext.createRoot('Fork-Agent orchestration dashboard', ['monitoring'], { source: 'dashboard' });
    STATE.mainAgent = new MainAgent(rootCtx);
    await STATE.mainAgent.init();
    STATE.spawnCounter = 0;

    // Auto-spawn 2 SpawnAgents, each with 2 ForkAgents
    for (let i = 0; i < 2; i++) {
      STATE.spawnCounter++;
      const spawn = STATE.mainAgent.spawn({
        taskDescription: `Spawn task ${STATE.spawnCounter} — data processing pipeline`,
        constraints: [`priority=${i+1}`],
        metadata: { index: i }
      });
      await spawn.init();

      for (let j = 0; j < 2; j++) {
        const fork = STATE.mainAgent.fork(spawn.id, {
          taskDescription: `Fork sub-task ${j+1} — parallel worker`,
          constraints: [`thread=${j}`],
          metadata: { subIndex: j }
        });
        await fork.init();
      }
    }

    // Wire memory listeners
    for (const cid of STATE.mainAgent.childIds) {
      const s = STATE.mainAgent.getChild(cid);
      if (s && s.sharedMemory && s.onMemoryChange) {
        s.onMemoryChange((payload) => {
          pushEvent(payload);
        });
      }
    }

    STATE.selectedAgentId = STATE.mainAgent.id;
    STATE.selectedSpawnId = null;
    renderAll();
  },

  spawnAgent() {
    const m = STATE.mainAgent;
    if (!m || m.status === AgentStatus.TERMINATED) return;
    try {
      STATE.spawnCounter++;
      const spawn = m.spawn({
        taskDescription: `Spawn task ${STATE.spawnCounter} — on-demand processing`,
        constraints: ['ondemand'],
      });
      spawn.init().then(() => {
        // Auto-fork 1
        const fork = m.fork(spawn.id, {
          taskDescription: 'Auto-forked worker',
        });
        fork.init().then(() => {
          if (spawn.onMemoryChange) {
            spawn.onMemoryChange(p => pushEvent(p));
          }
          renderAll();
        });
        renderAll();
      });
      STATE.selectedAgentId = spawn.id;
      STATE.selectedSpawnId = spawn.id;
      renderAll();
    } catch (e) {
      showToast('SPAWN failed: ' + e.message, true);
    }
  },

  forkAgent() {
    const m = STATE.mainAgent;
    if (!m) return;
    let spawnId = STATE.selectedSpawnId;
    if (!spawnId) {
      const sel = STATE.selectedAgentId;
      if (!sel) { showToast('Select a SpawnAgent first', true); return; }
      const s = m.getChild(sel);
      if (s) {
        spawnId = s.id;
        STATE.selectedSpawnId = spawnId;
      } else {
        // check if selected is a fork — find parent spawn
        for (const cid of m.childIds) {
          const sp = m.getChild(cid);
          if (sp && sp.getFork(sel)) { spawnId = sp.id; STATE.selectedSpawnId = spawnId; break; }
        }
      }
    }
    if (!spawnId) { showToast('Select a SpawnAgent first', true); return; }

    try {
      const fork = m.fork(spawnId, {
        taskDescription: 'On-demand fork worker',
      });
      fork.init().then(() => renderAll());
      STATE.selectedAgentId = fork.id;
      renderAll();
    } catch (e) {
      showToast('FORK failed: ' + e.message, true);
    }
  },

  async pauseAgent() {
    const agent = findAgent(STATE.selectedAgentId);
    if (!agent) { showToast('No agent selected', true); return; }
    try {
      await agent.pause();
      renderAll();
    } catch (e) {
      showToast('PAUSE failed: ' + e.message, true);
    }
  },

  async resumeAgent() {
    const agent = findAgent(STATE.selectedAgentId);
    if (!agent) { showToast('No agent selected', true); return; }
    try {
      await agent.resume();
      renderAll();
    } catch (e) {
      showToast('RESUME failed: ' + e.message, true);
    }
  },

  async terminateAgent() {
    const m = STATE.mainAgent;
    const agent = findAgent(STATE.selectedAgentId);
    if (!agent) { showToast('No agent selected', true); return; }
    if (agent.type === 'MAIN') { showToast('Cannot terminate MainAgent', true); return; }

    try {
      if (agent.type === 'SPAWN') {
        await m.terminateChild(agent.id);
        if (STATE.selectedSpawnId === agent.id) STATE.selectedSpawnId = null;
        if (STATE.selectedAgentId === agent.id) STATE.selectedAgentId = m.id;
      } else {
        // ForkAgent — terminate via parent Spawn
        for (const cid of m.childIds) {
          const s = m.getChild(cid);
          if (s && s.getFork(agent.id)) {
            await s.terminateFork(agent.id);
            if (STATE.selectedAgentId === agent.id) STATE.selectedAgentId = s.id;
            break;
          }
        }
      }
      renderAll();
    } catch (e) {
      showToast('TERMINATE failed: ' + e.message, true);
    }
  },

  memorySet() {
    const keyInput = document.getElementById('mem-key');
    const valInput = document.getElementById('mem-val');
    const key = keyInput?.value.trim();
    const valStr = valInput?.value.trim();
    if (!key) { showToast('Enter a key', true); return; }
    if (!valStr) { showToast('Enter a value', true); return; }

    let value;
    try { value = JSON.parse(valStr); } catch { value = valStr; }

    let spawnId = STATE.selectedSpawnId;
    if (!spawnId) {
      const sel = STATE.selectedAgentId;
      if (!sel) { showToast('Select a SpawnAgent first', true); return; }
      const m = STATE.mainAgent;
      const s = m.getChild(sel);
      if (s) {
        spawnId = s.id;
        STATE.selectedSpawnId = spawnId;
      } else {
        for (const cid of m.childIds) {
          const sp = m.getChild(cid);
          if (sp && sp.getFork(sel)) { spawnId = sp.id; STATE.selectedSpawnId = spawnId; break; }
        }
      }
    }
    if (!spawnId) { showToast('Select a SpawnAgent first', true); return; }

    const m = STATE.mainAgent;
    const spawn = m.getChild(spawnId);
    if (!spawn) { showToast('Spawn not found', true); return; }

    try {
      spawn.memorySet(key, value);
      keyInput.value = '';
      valInput.value = '';
      renderAll();
      showToast(`SET: ${key} = ${valStr}`);
    } catch (e) {
      showToast('MEMORY SET failed: ' + e.message, true);
    }
  },

  memoryClear() {
    let spawnId = STATE.selectedSpawnId;
    if (!spawnId) {
      const sel = STATE.selectedAgentId;
      if (!sel) { showToast('Select a SpawnAgent first', true); return; }
      const m = STATE.mainAgent;
      const s = m.getChild(sel);
      if (s) {
        spawnId = s.id;
        STATE.selectedSpawnId = spawnId;
      } else {
        for (const cid of m.childIds) {
          const sp = m.getChild(cid);
          if (sp && sp.getFork(sel)) { spawnId = sp.id; STATE.selectedSpawnId = spawnId; break; }
        }
      }
    }
    if (!spawnId) { showToast('Select a SpawnAgent first', true); return; }

    const m = STATE.mainAgent;
    const spawn = m.getChild(spawnId);
    if (!spawn) { showToast('Spawn not found', true); return; }

    try {
      spawn.memoryClear();
      renderAll();
      showToast('Memory cleared');
    } catch (e) {
      showToast('MEMORY CLEAR failed: ' + e.message, true);
    }
  },

  selectAgent(id) {
    STATE.selectedAgentId = id;
    const agent = findAgent(id);
    if (agent) {
      if (agent.type === 'SPAWN') STATE.selectedSpawnId = id;
      else if (agent.type === 'FORK') {
        const m = STATE.mainAgent;
        for (const cid of m.childIds) {
          const s = m.getChild(cid);
          if (s && s.getFork(id)) { STATE.selectedSpawnId = s.id; break; }
        }
      } else if (agent.type === 'MAIN') {
        STATE.selectedSpawnId = null;
      }
    }
    renderAll();
  },

  onSpawnSelect(val) {
    if (val) {
      STATE.selectedSpawnId = val;
      STATE.selectedAgentId = val;
    }
    renderAll();
  },

  render() { renderAll(); },
};

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════

function showToast(msg, isError = false) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ═══════════════════════════════════════════════
// BOOTSTRAP
// ═══════════════════════════════════════════════

// Expose for inline onclick handlers
window._selectAgent = (id) => dashboard.selectAgent(id);
window.dashboard = dashboard;

dashboard.init().then(() => {
  console.log('[Dashboard] Initialized with', STATE.mainAgent.childCount, 'spawns');

  if (!isLiveMode) {
    // Add some initial memory data for demo visual richness
    setTimeout(() => {
      const m = STATE.mainAgent;
      for (const cid of m.childIds) {
        const s = m.getChild(cid);
        if (s && s.sharedMemory) {
          s.memorySet('status', 'active');
          s.memorySet('priority', cid === m.childIds[0] ? 'high' : 'normal');
          s.memorySet('batch_id', `B-${Math.floor(Math.random()*9000+1000)}`);
        }
      }
      renderAll();
    }, 600);
  }

  // Poll for status + memory changes
  setInterval(() => {
    // Check for status changes by re-rendering
    const m = STATE.mainAgent;
    if (!m) return;

    // Re-wire memory listeners for new spawns
    for (const cid of m.childIds) {
      const s = m.getChild(cid);
      if (s && s.sharedMemory && s.onMemoryChange && !s._dashboardWired) {
        s._dashboardWired = true;
        s.onMemoryChange((payload) => {
          pushEvent(payload);
        });
      }
    }

    renderAll();
  }, 1500);

  // Periodic memory demo flush (demo mode only)
  if (!isLiveMode) {
    setInterval(() => {
      const m = STATE.mainAgent;
      if (!m || m.status === AgentStatus.TERMINATED) return;
      const cids = m.childIds;
      if (cids.length === 0) return;
      const spawn = m.getChild(cids[Math.floor(Math.random() * cids.length)]);
      if (spawn && spawn.sharedMemory && spawn.status === AgentStatus.RUNNING) {
        const heartbeats = ['task_count', 'last_active', 'throughput', 'latency_ms', 'queue_size'];
        const key = heartbeats[Math.floor(Math.random() * heartbeats.length)];
        const val = key === 'latency_ms' ? Math.floor(Math.random() * 200 + 5) :
                    key === 'throughput' ? Math.floor(Math.random() * 1000 + 100) :
                    key === 'queue_size' ? Math.floor(Math.random() * 50) :
                    key === 'last_active' ? new Date().toISOString() :
                    Math.floor(Math.random() * 50 + 1);
        spawn.memorySet(key, val);
        renderAll();
      }
    }, 4000);
  }
});

// Global error boundary
window.addEventListener('error', (e) => {
  showToast('Error: ' + e.message, true);
});

console.log('[Dashboard] Ready. Type=demo mode active:', !isLiveMode);
</script>
